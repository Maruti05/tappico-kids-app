name: tappico
description: TapPico - Kids ABC & 123 Learning App
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^3.3.1

  # TTS
  flutter_tts: ^4.0.2
  sherpa_onnx: ^1.13.1
  path_provider: ^2.1.0

  # Animations
  lottie: ^3.1.0
  animate_do: ^5.1.0
  flutter_animate: ^4.5.0

  # UI
  google_fonts: ^8.0.2
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  smooth_page_indicator: ^2.0.1

  # Storage
  shared_preferences: ^2.2.3

  # Icons
  iconsax_flutter: ^1.0.0

  # Utils
  audioplayers: ^6.0.0  

  flutter_markdown: ^0.7.7+1

  google_mobile_ads: ^8.0.0

  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/tap_pico_app.png"  
  

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/shapes/
    - assets/kokoro/model.onnx
    - assets/kokoro/voices.bin
    - assets/kokoro/tokens.txt

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
