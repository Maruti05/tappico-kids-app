name: tappico
description: TapPico - Kids ABC & 123 Learning App
publish_to: 'none'
version: 0.2.2+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^3.3.1

  # TTS
  flutter_tts: ^4.0.2


  # Animations
  flutter_animate: ^4.5.0

  # UI
  google_fonts: ^8.1.0

  # Storage
  shared_preferences: ^2.2.3

  flutter_markdown: ^0.7.7+1

  google_mobile_ads: ^8.0.0

  connectivity_plus: ^7.1.1

  # package_info_plus: ^9.0.1  # Temporarily disabled - causes build issues

  share_plus: ^10.1.4

  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/tap_pico_app.png"  
  

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/shapes/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
